[project]
name = "carriersets"
version = "1.0.0"
description = "85 formal systems as P/G->Q carriers, with 92 executable checks and a self-computed paid fraction"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "numpy>=1.26"]
license = {text = "MIT"}

[tool.setuptools]
packages = ["carrierlib", "carrierlib.checks", "carriers"]
